<!DOCTYPE html>
<html>
<head>
  <title>Procrastination Detective</title>
</head>
<body>
  <div id="screen1">
    <h1>🕵️‍♂️Procrastination Detective</h1>
    <p>Cracking the case on your roadblocks.</p>
    <button onclick="goToQuestions()">I don't wanna start</button>
  </div>
  <div id="screen2" style="display:none;">
    <h2>The Investigation</h2>

    <p>1)What are you working on?</p>
    <select id="q1">
      <option value="test">studying for a test</option>
      <option value="essay">an essay</option>
      <option value="homework">homework</option>
      <option value="project">a computer project</option>
    </select>
    <p>2)How long will this probably take?</p>
    <select id="q2">
      <option value="days">A few days</option>
      <option value="30min">30 minutes</option>
      <option value="15min">15 minutes</option>
      <option value="10min">10 minutes or less</option>
    </select>
    <p>3)Why don't you even start?</p>
    <select id="q3">
      <option value="overwhelmed">It feels like too much</option>
      <option value="confused">I don't understand it</option>
      <option value="lost">I dont know where to start</option>
      <option value="anxious">I'm worried that I'll mess it up</option>
      <option value="bored">I'd rather do something else</option>
    </select>
    <p>4)Are you tired?</p>
    <select id="q4">
      <option value="yes">Yes</option>
      <option value="no">No</option>
      <option value="little">A little</option>
    </select>
    <P>5)Is the assignmnet hard or are you confused?</P>
    <select id="q5">
      <option value="hard">Its's hard</option>
      <option value="both">It's hard and confusing</option>
      <option value="confused">I'm confused</option>
      <option value="neither">Neither</option>
    </select>
    <p>6)Have you started yet?</p>
    <select id="q6">
      <option value="yes">Yes</option>
      
                                       
  
        
</body>
</html>
