<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procrastination Detective</title>

    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2f2419;
        background: #f4ead7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.6),
            transparent 35%
          ),
          #f4ead7;
      }

      .case-file {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: clamp(28px, 6vw, 64px);
        border: 2px solid #d6bd93;
        border-radius: 12px;
        background: #fffaf0;
        box-shadow: 8px 10px 0 rgba(105, 74, 40, 0.12);
      }

      .stamp {
        display: inline-block;
        margin-bottom: 18px;
        padding: 7px 12px;
        border: 2px solid #bc543e;
        color: #bc543e;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transform: rotate(-2deg);
      }

      h1,
      h2 {
        margin: 0;
        color: #3e2d20;
        font-family: Georgia, "Times New Roman", serif;
      }

      h1 {
        max-width: 620px;
        font-size: clamp(2.5rem, 8vw, 5.2rem);
        line-height: 0.98;
      }

      h2 {
        font-size: clamp(2rem, 5vw, 3.2rem);
      }

      .subtitle,
      .intro {
        max-width: 560px;
        margin: 20px 0 0;
        color: #715d4a;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .clue {
        margin: 30px 0 0;
        padding: 14px 18px;
        border-left: 4px solid #d69d3e;
        background: #fff2c9;
        color: #624822;
        font-weight: 700;
      }

      .question {
        margin: 28px 0 0;
      }

      label {
        display: block;
        margin-bottom: 9px;
        color: #604b38;
        font-weight: 800;
      }

      select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #cdb795;
        border-radius: 8px;
        color: #34271c;
        background: #fffdf8;
        font: inherit;
      }

      select:focus,
      button:focus-visible {
        outline: 3px solid #e7b95e;
        outline-offset: 3px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      button {
        padding: 13px 20px;
        border: 0;
        border-radius: 8px;
        color: #fffaf0;
        background: #3e2d20;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover {
        background: #5b3f2a;
        transform: translateY(-1px);
      }

      button.secondary {
        color: #604b38;
        border: 1px solid #cdb795;
        background: transparent;
      }

      button.secondary:hover {
        background: #f7ecd8;
      }

      .result {
        margin-top: 28px;
        padding: 24px;
        border: 1px dashed #bc543e;
        background: #fff3dc;
      }

      .result h3 {
        margin: 0;
        color: #bc543e;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.8rem;
      }

      .result p {
        margin: 12px 0 0;
        color: #604b38;
        line-height: 1.65;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 540px) {
        body {
          padding: 12px;
        }

        .case-file {
          padding: 28px 20px;
        }
      }
    </style>
  </head>

  <body>
    <main class="case-file">
      <section id="screen1" aria-labelledby="welcome-title">
        <span class="stamp">Case file: open</span>

        <h1 id="welcome-title">
          🕵️‍♂️ Procrastination Detective
        </h1>

        <p class="subtitle">
          Cracking the case on your roadblocks.
        </p>

        <p class="clue">
          No judgment. Just clues, patterns, and one tiny next step.
        </p>

        <div class="actions">
          <button type="button" onclick="goToQuestions()">
            I don't wanna start
          </button>
        </div>
      </section>

      <section
        id="screen2"
        class="hidden"
        aria-labelledby="investigation-title"
      >
        <span class="stamp">Investigation in progress</span>

        <h2 id="investigation-title">
          The Investigation
        </h2>

        <p class="intro">
          Answer honestly. The detective is on your side.
        </p>

        <div class="question">
          <label for="q1">
            1) What are you working on?
          </label>

          <select id="q1">
            <option value="test">Studying for a test</option>
            <option value="essay">An essay</option>
            <option value="homework">Homework</option>
            <option value="project">A computer project</option>
          </select>
        </div>

        <div class="question">
          <label for="q2">
            2) How long will this probably take?
          </label>

          <select id="q2">
            <option value="days">A few days</option>
            <option value="30min">30 minutes</option>
            <option value="15min">15 minutes</option>
            <option value="10min">10 minutes or less</option>
          </select>
        </div>

        <div class="question">
          <label for="q3">
            3) Why don't you even start?
          </label>

          <select id="q3">
            <option value="overwhelmed">
              It feels like too much
            </option>

            <option value="confused">
              I don't understand it
            </option>

            <option value="lost">
              I don't know where to start
            </option>

            <option value="anxious">
              I'm worried that I'll mess it up
            </option>

            <option value="bored">
              I'd rather do something else
            </option>
          </select>
        </div>

        <div class="question">
          <label for="q4">
            4) Are you tired?
          </label>

          <select id="q4">
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="little">A little</option>
          </select>
        </div>

        <div class="question">
          <label for="q5">
            5) Is the assignment hard or are you confused?
          </label>

          <select id="q5">
            <option value="hard">It's hard</option>
            <option value="both">It's hard and confusing</option>
            <option value="confused">I'm confused</option>
            <option value="neither">Neither</option>
          </select>
        </div>

        <div class="question">
          <label for="q6">
            6) Have you started yet?
          </label>

          <select id="q6">
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="barely">Barely</option>
          </select>
        </div>

        <div class="actions">
          <button type="button" onclick="solveCase()">
            Solve the case
          </button>

          <button
            type="button"
            class="secondary"
            onclick="goHome()"
          >
            Start over
          </button>
        </div>
      </section>

      <section
        id="screen3"
        class="hidden"
        aria-labelledby="result-title"
      >
        <span class="stamp">Case solved</span>

        <h2 id="result-title">
          The Case File
        </h2>

        <div class="result" aria-live="polite">
          <h3 id="result-heading"></h3>
          <p id="result-text"></p>
        </div>

        <div class="actions">
          <button type="button" onclick="startMission()">
            Start the tiny mission
          </button>

          <button
            type="button"
            class="secondary"
            onclick="goToQuestions()"
          >
            Investigate again
          </button>
        </div>
      </section>
    </main>

    <script>
      const cases = {
        overwhelmed: {
          title: "The Overwhelm Suspect",
          text:
            "The task looks bigger than one person-sized step. " +
            "Your mission: write down the very first action, make it " +
            "take five minutes or less, and do only that."
        },

        confused: {
          title: "The Foggy Instructions Suspect",
          text:
            "The real roadblock is missing information. Your mission: " +
            "write one specific question, then look at the instructions " +
            "or ask someone who can answer it."
        },

        lost: {
          title: "The Missing Starting Point",
          text:
            "You do not need the whole plan yet. Your mission: open the " +
            "assignment, make a rough heading or checklist, and choose " +
            "the easiest item."
        },

        anxious: {
          title: "The Perfectionism Suspect",
          text:
            "Fear of doing it wrong is blocking the first draft. Your " +
            "mission: make a deliberately messy two-minute version. It " +
            "can be fixed after it exists."
        },

        bored: {
          title: "The Distraction Suspect",
          text:
            "Your brain is looking for a faster reward. Your mission: " +
            "set a 10-minute timer, put distractions out of reach, and " +
            "work until the timer ends."
        }
      };

      function goToQuestions() {
        document
          .getElementById("screen1")
          .classList.add("hidden");

        document
          .getElementById("screen3")
          .classList.add("hidden");

        document
          .getElementById("screen2")
          .classList.remove("hidden");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

      function goHome() {
        document
          .getElementById("screen2")
          .classList.add("hidden");

        document
          .getElementById("screen3")
          .classList.add("hidden");

        document
          .getElementById("screen1")
          .classList.remove("hidden");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

      function solveCase() {
        const reason = document.getElementById("q3").value;
        const selectedCase = cases[reason];

        document.getElementById("result-heading").textContent =
          selectedCase.title;

        document.getElementById("result-text").textContent =
          selectedCase.text;

        document
          .getElementById("screen2")
          .classList.add("hidden");

        document
          .getElementById("screen3")
          .classList.remove("hidden");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

      function startMission() {
        document.getElementById("result-text").textContent =
          "Mission started. Take the smallest possible step now—" +
          "five minutes is enough to crack the case.";
      }
    </script>
  </body>
</html>
